# Readr — XcodeGen project definition.
#
# This file is the source of truth for project structure. `Readr.xcodeproj` is a
# generated artifact and is not committed; run `xcodegen generate` after cloning
# or after changing anything here.
#
# Changing target structure requires human approval — see AGENTS.md.

name: Readr

options:
  bundleIdPrefix: dev.opus
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "2700"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  # Declared now, imported by nothing yet. Both arrive with the first source plugin.
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.13.9
  Nuke:
    url: https://github.com/kean/Nuke
    from: 13.2.0

targets:
  Readr:
    type: application
    platform: iOS
    sources:
      - path: Readr
        excludes:
          # Per-folder codemap.md / AGENTS.md documentation must never ship in the
          # app bundle. Verified by the bundle check in the verify skill.
          - "**/*.md"
    dependencies:
      - package: SwiftSoup
      - package: Nuke
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.opus.readr
        PRODUCT_NAME: Readr
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Readr/Resources/Info.plist
      properties:
        CFBundleDisplayName: Readr
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - processing
        # Registered here so BGTaskScheduler identifiers are declared before the
        # Background/ lane has any code. See architecture.md §Background execution.
        BGTaskSchedulerPermittedIdentifiers:
          - dev.opus.readr.refresh.library
          - dev.opus.readr.process.downloads
        ITSAppUsesNonExemptEncryption: false

  ReadrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReadrTests
        excludes:
          - "**/*.md"
    dependencies:
      - target: Readr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.opus.readr.tests
        # The test bundle needs an Info.plist to be code signed. It has no
        # properties worth hand-maintaining, so let the toolchain generate it.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Readr:
    build:
      targets:
        Readr: all
        ReadrTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReadrTests
