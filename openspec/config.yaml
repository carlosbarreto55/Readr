schema: spec-driven

context: |
  Readr — a personal-use iOS app for reading webnovels and manhwa from multiple
  sites through Source plugins behind a common protocol.

  Stack: SwiftUI, Swift 6 (strict concurrency), Swift Concurrency + @Observable,
  URLSession, SwiftSoup, SwiftData, UserDefaults, Nuke, BGTaskScheduler,
  Core Spotlight. iOS 26.0, iPhone only. No DI framework — an AppContainer
  composition root injected through the SwiftUI Environment.

  The Xcode project is generated by XcodeGen from project.yml; Readr.xcodeproj is
  gitignored and must never be hand-edited.

  Normative architecture lives in architecture.md — layer rules, contracts, and
  twelve invariants. Specs must not restate it; they define capability behavior.
  Two invariants are load-bearing and easy to violate: sourceID must use an
  explicitly stable hash (never Swift's per-process-seeded Hasher), and SwiftData
  @Model classes are persistence types that never cross the repository boundary.

  Screens are four files: <Name>Screen, <Name>Content, <Name>Model, <Name>State.
  Navigation travels as Effects, never as state.

  Readr is a ground-up reimplementation of the Android app ReaderParser
  (https://github.com/PedrocaODev/ReaderParser). It shares that app's
  architecture, not its code and not its interface.

  Conventional commit prefixes: feat, fix, refactor, ci, cd, docs.

rules:
  proposal:
    - State the user-visible outcome, not the implementation.
    - Include a "Non-goals" section.
  specs:
    - Requirements use SHALL/MUST. Every requirement carries at least one scenario.
    - Scenarios are WHEN/THEN, written against observable behavior.
    - Never restate an architecture.md invariant; reference it instead.
  tasks:
    - Every task names the file it creates or changes.
    - New behavior ships with its test in the same task.
